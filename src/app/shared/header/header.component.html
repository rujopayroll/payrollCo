

<p-menubar >


     <ng-template pTemplate="start" class="flex align-content-center flex-wrap">

      <div class="flex align-content-center flex-wrap">


      <ng-container>
        <img src="assets/images/LOGOTIPO_ANIMO_MENUBAR.png" routerLink="/dashboard"  height="40" style="float:right" class="mr-8">















           <p-menu #menup [popup]="true" [model]="menu" appendTo="body"></p-menu>
          <button type="button" class="p-button-text text-cyan-600" pButton label="Menú" icon="pi pi-angle-down"  (click)="menup.toggle($event)"></button>



            <span class="flex align-content-center flex-wrap" *ngIf="company1.img"><img class="p-mr-6 flex align-content-center flex-wrap" [src]="company1.img" height="40" class="p-ml-6" style="border-radius: 50%" alt="user"></span>
            <span class="flex align-content-center flex-wrap" *ngIf="!company1.img"> <img class="p-mr-6 flex align-content-center flex-wrap" src="assets/images/SIN-IMAGEN.jpg" height="40" class="p-ml-6" style="border-radius: 50%"></span>
            <span class="flex align-content-center flex-wrap mr-4 textLogo">{{empresa.name}}</span>
          </ng-container>
        </div>
          </ng-template>













    <ng-template pTemplate="end">
        <div class="flex align-content-center flex-wrap">
          <button pButton (click)="foro()"  styleClass="p-button-sm" class="p-mr-6 p-button-warning bg-orange-400 text-0" label="Comunidad" icon="pi pi-users"></button>


        <!-- <span class="flex align-content-center flex-wrap text-blue-500 p-mr-2">Bienvenido(a):</span>
        <span class="flex align-content-center flex-wrap"><p-splitButton class="flex align-content-center flex-wrap mr-2" label="{{usuario.name | titlecase}}" [model]="items" styleClass="p-button-primary"></p-splitButton></span> -->
       <!-- <span class="flex align-content-center flex-wrap p-mr-2">{{usuario.name | titlecase}}</span> -->
        <span class="flex align-items-center justify-content-center font-bold text-600 font-medium text-lg m-2">{{ usuario?.name | titlecase}}</span>
        <span *ngIf="usuario?.img"><img [src]="usuario?.img" height="40" class="p-mr-2 cursor-pointer flex align-content-center flex-wrap" (click)="op.toggle($event)" style="border-radius: 50%" alt="user"></span>
        <span *ngIf="!usuario?.img"> <img src="assets/images/no-image.png" height="40" class="p-mr-2 cursor-pointer flex align-content-center flex-wrap" (click)="op.toggle($event)" style="border-radius: 50%"></span>

        <p-overlayPanel #op [showCloseIcon]="false" appendTo="body" [style]="{width: '250px'}">
            <ng-template pTemplate>
                <div class="mb-2">

                    <span class="text-center flex justify-content-center font-bold text-600 font-medium text-xl" style="text-align: center;">{{ usuario?.name | titlecase}}</span>

                </div>
                <hr class="mb-2 mx-0 border-top-1 border-none surface-border mt-auto" />
                <div class="mb-2 p-fluid">

                    <button pButton pRipple type="button" routerLink="/auth/profile" label="Mi Perfil" icon="pi pi-user" class="p-button-secondary p-button-text" style="text-align: left;"></button>

                </div>
               <!--  <span *ngIf="company2.companies.length > 1"> <hr class="mb-2 mx-0 border-top-1 border-none surface-border mt-auto" /></span> -->
                 <div class="mb-2 p-fluid">

                    <span *ngIf="company2?.companies?.length > 1"><button pButton pRipple routerLink="/companies/list" type="button" label="Cambiar de Empresa" icon="pi pi-home" class="p-button-secondary p-button-text" style="text-align: left;"></button></span>

                </div>
          <hr class="mb-2 mx-0 border-top-1 border-none surface-border mt-auto" />
                <div class="mb-2 p-fluid">

                    <button pButton pRipple type="button" (click)="crearEmpresa()" label="Registrar Nueva Empresa" icon="pi pi-home" class="p-button-secondary p-button-text" style="text-align: left;"></button>

                </div>
                <hr class="mb-2 mx-0 border-top-1 border-none surface-border mt-auto" />
                <div class="mb-2 p-fluid">

                    <button pButton pRipple type="button" label="Suscripción" icon="pi pi-credit-card" class="p-button-secondary p-button-text" style="text-align: left;"></button>

                </div>
                <hr class="mb-2 mx-0 border-top-1 border-none surface-border mt-auto" />
                <div class="p-fluid">

                    <button pButton pRipple type="button" (click)="_usuarioService.logout()" label="Cerrar Sesión" icon="pi pi-power-off" class="p-button-secondary p-button-text" style="text-align: left;"></button>

                </div>
            </ng-template>
        </p-overlayPanel>


    </div>
    </ng-template>

</p-menubar>
