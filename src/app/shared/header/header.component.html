<p-menubar class="animo-menubar">

   <!-- Izquierda: marca -->
   <ng-template pTemplate="start">
    <div class="brand">
      <img src="assets/images/LOGOTIPO_ANIMO_MENUBAR.png" routerLink="/dashboard" alt="animo" height="40" />


      <div class="user ml-6" (click)="showMenuPanel($event)">
        <i class="pi pi-bars" style="font-size: 2rem" ></i>
        <span class="name">Menu</span>

      </div>




      <div class="user ml-4">
        <span *ngIf="company1.img"><img class="avatar" [src]="company1.img" height="40" alt="company"></span>
            <span *ngIf="!company1.img"> <img class="avatar" src="assets/images/SIN-IMAGEN.jpg" height="40" ></span>
            <span class="name">{{empresa.name}}</span>
      </div>

      <p-overlayPanel #menuPanel [dismissable]="true">
        <p-menu [model]="menu" [style]="{width:'100%'}"></p-menu>
      </p-overlayPanel>

    </div>



  </ng-template>

    <!-- Derecha: acciones -->
    <ng-template pTemplate="end">
      <div class="right-actions">


        <!-- CTA Comunidad -->
        <button pButton type="button" label="Comunidad" icon="pi pi-users"
                class="p-button comunidad" ></button>

        <!-- Usuario-->
        <div class="user" (click)="showUserPanel($event)">
          <!-- <p-avatar

          image= *ngIf="usuario?.img"><img [src]="usuario?.img"
          shape="circle" styleClass="avatar"></p-avatar> -->
          <span *ngIf="usuario?.img"><img [src]="usuario?.img" height="40" class="avatar" alt="user" ></span>
          <span *ngIf="!usuario?.img"> <img src="assets/images/no-image.png" height="40" class="avatar" ></span>
          <span class="name">{{ usuario?.name | titlecase}}</span>

        </div>

        <p-overlayPanel #userPanel [dismissable]="true">
          <p-menu [model]="items" [style]="{width:'100%'}"></p-menu>
        </p-overlayPanel>
      </div>
    </ng-template>

</p-menubar>
