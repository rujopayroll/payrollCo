name: Deploy paryoll from App to S3

on:
  push:
    branches:
      - develop # Change this to the branch you want to deploy from
env:
  BUCKET: "dev-payroll-web"
jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Setup Node.js
        uses: actions/setup-node@v2
        with:
          node-version: "14" # Specify the Node.js version

      - name: Install dependencies
        run: |
          npm install --no-audit
          npm install -g @angular/cli

      - name: Build Angular App
        run: |
          npm run build:development
        # ng build --prod  # Adjust the build command if needed

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy to S3
        run: |
          aws s3 sync ./dist s3://${{ env.BUCKET }} --delete
          aws s3 cp ./dist/index.html s3://${{ env.BUCKET }} --recursive

      # - name: Invalidate CloudFront Cache (optional)
      #   run: |
      #     aws cloudfront create-invalidation --distribution-id YOUR_DISTRIBUTION_ID --paths "/*"
